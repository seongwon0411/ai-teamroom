<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http: https:" />
  <title>AI팀룸</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <!-- 처음 실행: 초대 링크로 연결 -->
  <section id="connect" class="connect" hidden>
    <div class="card">
      <div class="logo">🤝 AI팀룸</div>
      <p class="muted">팀장에게 받은 <b>초대 링크</b>를 붙여넣으세요.<br />연결한 뒤에는 ChatGPT·Claude·Gemini에 평소처럼 로그인해서 대화만 하면 됩니다.</p>
      <form id="connect-form">
        <input id="room-url" placeholder="http://…/?room=xxxx" required autofocus />
        <button class="primary">연결</button>
      </form>
      <p id="connect-error" class="error"></p>
    </div>
  </section>

  <!-- 메인 화면 -->
  <section id="main" class="main" hidden>
    <header class="toolbar">
      <nav class="ai-tabs">
        <button data-ai="chatgpt">ChatGPT</button>
        <button data-ai="claude">Claude</button>
        <button data-ai="gemini">Gemini</button>
      </nav>
      <button id="share-toggle" class="share on" title="끄면 이후 대화는 팀에 공유되지 않습니다"></button>
      <span id="conv-status" class="conv-status"></span>
      <span class="spacer"></span>
      <span id="sync-status" class="sync-status"></span>
      <button id="toggle-room" class="ghost" title="팀룸 패널 접기/펼치기">팀룸 ▸</button>
      <button id="change-room" class="ghost" title="다른 팀룸으로 연결">⋯</button>
    </header>
    <div class="split">
      <div id="ai-area" class="ai-area"></div>
      <div id="room-area" class="room-area"></div>
    </div>
  </section>

  <script src="shell.js"></script>
</body>
</html>
