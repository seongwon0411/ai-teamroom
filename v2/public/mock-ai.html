<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>새 채팅 - Mock AI</title>
  <style>
    body { margin: 0; font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; background: #fff; color: #222; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 10px 16px; border-bottom: 1px solid #eee; font-weight: 700; }
    #thread { flex: 1; overflow-y: auto; padding: 16px 20%; }
    [data-message-author-role], [data-message-role] { margin: 12px 0; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
    [data-message-author-role="user"], [data-message-role="user"] { background: #f1f1f1; margin-left: 30%; }
    form { display: flex; gap: 8px; padding: 12px 20%; border-top: 1px solid #eee; }
    textarea { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc; font: inherit; }
  </style>
</head>
<body>
  <!-- 데스크톱 앱 자동 테스트용 가짜 AI 사이트 (ChatGPT와 같은 화면 구조) -->
  <header>Mock AI (테스트용)</header>
  <div id="thread"></div>
  <form id="f">
    <textarea id="prompt-textarea" rows="2" placeholder="메시지 입력"></textarea>
    <button id="send">전송</button>
  </form>
  <script>
    const thread = document.getElementById("thread");
    let n = 0;
    // 실제 ChatGPT(2026-11 확인)와 같은 구조: <ol data-conversation-transcript><li data-message-role id>…
    const list = document.createElement("ol");
    list.setAttribute("data-conversation-transcript", "");
    list.style.cssText = "list-style:none;padding:0;margin:0";
    thread.appendChild(list);
    function add(role, text) {
      const li = document.createElement("li");
      li.setAttribute("data-message-role", role);
      li.id = "m" + (++n) + "-" + Math.random().toString(36).slice(2, 8);
      const body = document.createElement("div");
      body.setAttribute(role === "user" ? "data-user-message-bubble" : "data-assistant-markdown-root", "");
      body.textContent = text;
      li.appendChild(body);
      list.appendChild(li);
      return body;
    }
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const ta = document.getElementById("prompt-textarea");
      const q = ta.value.trim();
      if (!q) return;
      ta.value = "";
      add("user", q);
      const params = new URLSearchParams(location.search);
      // 실제 ChatGPT처럼 대화 ID는 답변이 나오기 시작한 뒤(약 1초 후)에 주소에 붙음
      // ?noid=1 : 주소에 대화 ID가 끝까지 생기지 않는 경우 흉내
      if (!params.get("c") && !params.get("noid")) {
        setTimeout(() => {
          history.replaceState(null, "", "?c=" + Math.random().toString(36).slice(2, 10));
          document.title = q.slice(0, 20) + " - Mock AI";
        }, 1000);
      }
      const stop = document.createElement("button");
      stop.setAttribute("data-testid", "stop-button");
      stop.setAttribute("aria-label", "생성 중단하기");
      stop.textContent = "■ 중지";
      document.getElementById("f").appendChild(stop);
      const a = add("assistant", "");
      const answer = `"${q}"에 대한 답변입니다.\n\n1. 제품(Product): 핵심 가치 정의\n2. 가격(Price): 경쟁사 대비 포지셔닝\n3. 유통(Place): 온·오프라인 채널\n4. 촉진(Promotion): SNS 중심 캠페인`;
      for (const ch of answer.match(/[\s\S]{1,3}/g)) {
        a.textContent += ch;
        await new Promise((r) => setTimeout(r, 40));
      }
      stop.remove();
    };
  </script>
</body>
</html>
